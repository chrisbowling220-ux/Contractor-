<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1f2e" />
  <meta name="robots" content="noindex" />
  <title>No connection — BuildPro+</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #1a1f2e; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
    main { max-width: 420px; text-align: center; }
    .logo { width: 56px; height: 56px; background: #f97316; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 28px; color: #1a1f2e; margin-bottom: 20px; }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { font-size: 16px; line-height: 1.5; color: #cbd5e1; margin: 0 0 24px; }
    button { background: #fff; color: #1a1f2e; border: 0; border-radius: 10px; padding: 14px 28px; font-size: 16px; font-weight: 700; cursor: pointer; min-height: 48px; }
    button:focus-visible { outline: 3px solid #fdba74; outline-offset: 3px; }
    #status { font-size: 14px; color: #94a3b8; margin: 16px 0 0; min-height: 20px; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">B</div>
    <h1>No connection</h1>
    <p>BuildPro+ needs a signal to load your jobs. Nothing is lost. This page will reload by itself as soon as you're back online.</p>
    <button type="button" id="retry">Try again</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    var status = document.getElementById('status')
    function retry() { status.textContent = 'Checking…'; window.location.reload() }
    document.getElementById('retry').addEventListener('click', retry)
    window.addEventListener('online', retry)
  </script>
</body>
</html>
